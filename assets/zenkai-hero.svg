 <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="white" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="620" rx="36" fill="#08070D"/>
<rect width="1200" height="620" rx="36" fill="url(#grid)"/>

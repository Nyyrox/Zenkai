<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="logo" x1="360" y1="180" x2="840" y2="270" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset=".52" stop-color="#D9D4E3"/>
    <stop offset="1" stop-color="#A79CAF"/>
  </linearGradient>
  <linearGradient id="accent" x1="210" y1="410" x2="990" y2="410" gradientUnits="userSpaceOnUse">
    <stop stop-color="#8B5CF6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#C084FC"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="violet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 150) rotate(35) scale(360 300)">
    <stop stop-color="#8B5CF6" stop-opacity=".28"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 470) rotate(-30) scale(330 270)">
    <stop stop-color="#38BDF8" stop-opacity=".16"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
    <path d="M52 0H0V52" stroke="white" stroke-opacity=".025"/>
  </pattern>
</defs>

<rect width="1200" height="620" rx="36" fill="#07070A"/>
<rect width="1200" height="620" rx="36" fill="url(#grid)"/>

<ellipse cx="300" cy="145" rx="310" ry="250" fill="url(#violet)" filter="url(#blur)">
  <animate attributeName="cx" values="300;410;300" dur="10s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="920" cy="455" rx="330" ry="260" fill="url(#blue)" filter="url(#blur)">
  <animate attributeName="cy" values="455;390;455" dur="12s" repeatCount="indefinite"/>
</ellipse>

<!-- premium frame -->
<rect x="42" y="42" width="1116" height="536" rx="34" fill="#FFFFFF" fill-opacity=".018" stroke="white" stroke-opacity=".10"/>
<rect x="66" y="66" width="1068" height="488" rx="28" stroke="white" stroke-opacity=".045"/>

<!-- top chrome -->
<circle cx="94" cy="96" r="4" fill="#8B5CF6"/>
<circle cx="111" cy="96" r="4" fill="#C084FC" fill-opacity=".65"/>
<circle cx="128" cy="96" r="4" fill="#38BDF8" fill-opacity=".55"/>
<text x="1060" y="101" text-anchor="end" fill="#77717F" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4">WATCH • READ • DISCOVER</text>

<!-- logo -->
<text x="600" y="235" text-anchor="middle" fill="url(#logo)" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="18">ZENKAI</text>
<rect x="435" y="258" width="330" height="2" rx="1" fill="url(#accent)"/>
<text x="600" y="294" text-anchor="middle" fill="#AAA3B4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" letter-spacing="6">ANIME  •  MANGA  •  NOVELS</text>

<!-- tagline -->
<g>
  <rect x="290" y="350" width="620" height="116" rx="28" fill="#0C0C11" fill-opacity=".88" stroke="white" stroke-opacity=".09"/>
  <text x="600" y="397" text-anchor="middle" fill="#F5F3F7" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">Your stories. One place.</text>
  <text x="600" y="429" text-anchor="middle" fill="#817A8C" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">STREAM  ·  READ  ·  SAVE  ·  CONNECT</text>
</g>

<!-- subtle bottom accent -->
<rect x="300" y="505" width="600" height="1" fill="url(#accent)"/>
<text x="600" y="530" text-anchor="middle" fill="#5F5968" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4">ZENKAI ANDROID EXPERIENCE</text>

<circle cx="170" cy="485" r="3" fill="#8B5CF6" opacity=".7">
  <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite"/>
</circle>
<circle cx="1030" cy="170" r="3" fill="#38BDF8" opacity=".6">
  <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
</circle>
</svg>
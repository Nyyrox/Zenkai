 <animate attributeName="cx" values="270;420;270" dur="9s" repeatCount="indefinite"/>
 <animate attributeName="cy" values="160;280;160" dur="11s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="930" cy="430" rx="280" ry="220" fill="url(#g2)" filter="url(#blur)">
 <animate attributeName="cx" values="930;790;930" dur="10s" repeatCount="indefinite"/>
</ellipse>
<rect x="72" y="72" width="1056" height="476" rx="30" fill="white" fill-opacity=".035" stroke="white" stroke-opacity=".12"/>
<g opacity=".7"><circle cx="116" cy="112" r="5" fill="#FF6BAA"/><circle cx="136" cy="112" r="5" fill="#B88CFF"/><circle cx="156" cy="112" r="5" fill="#8DA8FF"/></g>
<text x="600" y="215" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="16">ZENKAI</text>
